name: cicd

on:
  push:
    paths: [ 'src/**', 'Dockerfile' ]
    branches: [ main ]

jobs:

  ci:
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    runs-on: ubuntu-latest
    steps:

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: thejaredddy/python-app
          tags: |
            type=sha,format=short

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
        
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags}}
  
  cd: 
    runs-on: self-hosted
    needs: ci

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Modify values file
        shell: bash
        run: |
          echo "image tag: ${{ needs.ci.outputs.image_tag }}" 
          wget -qO ./yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          # 2. Make it executable
          chmod +x ./yq
          # 3. Run it using ./yq (
          ./yq -i '.image.tag = "${{ needs.ci.outputs.image_tag }}"' charts/python-app/values.yaml

      - name: commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update image tag to ${{ needs.ci.outputs.image_tag }}"

      - name: Install ArgoCD CLI
        shell: bash
        run: |
          curl -ksSL -o argocd https://${{ vars.ARGOCD_SERVER }}/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/argocd

      
      - name: Argocd Sync
        shell: bash 
        run: |
          argocd login ${{ vars.ARGOCD_SERVER }} \
            --insecure \
            --grpc-web \
            --username ${{ secrets.ARGOCD_USERNAME }} \
            --password ${{ secrets.ARGOCD_PASSWORD }}

          argocd app sync python-app

